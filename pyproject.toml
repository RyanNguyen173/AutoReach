[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoreach"
version = "0.1.0"
description = "Find contacts in staff directories and send tailored cold emails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "typer>=0.12",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
render = ["playwright>=1.44"]
dev = ["pytest>=8.0"]

[project.scripts]
autoreach = "autoreach.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
