districts, e.g. Norman Public Schools). Rendered client-side by a Vue app, so a
plain fetch of the page returns an empty shell - this is the DOM *after* rendering,
the shape `--render` should produce. People and addresses are fictional.
-->

      </div>
    </div>
  </div>
  <div data-testid="staff-card" class="contact-box">
    <div class="staff-avatar"><img class="staff-image" src="/img/2.png" alt=""></div>
